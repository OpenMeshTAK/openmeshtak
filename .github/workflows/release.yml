name: Release

# Pushing a tag such as v0.2.0 verifies Core and the Web app at that tag, publishes the multi-arch
# OpenMeshTak image (Core serving the Web app) to GHCR and creates the GitHub release. Both
# repositories share one version: tag openmeshtak-web with the same version first; both
# package.json versions must equal the tag.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/openmeshtak/openmeshtak
  WEB_REPOSITORY: OpenMeshTAK/openmeshtak-web

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: file:./server/data/db/ci.sqlite
      NODE_ENV: test
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check the tag against package.json
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::Tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH[-PRERELEASE]."
            exit 1
          fi
          package_version="$(node -p "require('./package.json').version")"
          if [ "$version" != "$package_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $package_version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: pnpm db:deploy

      - name: Audit dependencies
        run: pnpm audit --audit-level=moderate

      - name: Verify project
        run: pnpm check

      - name: Smoke test a clean production install
        run: pnpm smoke:clean-install

      - name: Verify generated contract is committed
        run: git diff --exit-code -- openapi/openapi.json src/generated/routes.ts

  verify-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # WEB_REPOSITORY_TOKEN is only needed while openmeshtak-web is private.
      - name: Check out the Web app at the same tag
        uses: actions/checkout@v4
        with:
          repository: ${{ env.WEB_REPOSITORY }}
          ref: ${{ github.ref_name }}
          token: ${{ secrets.WEB_REPOSITORY_TOKEN || github.token }}

      - name: Check the tag against the Web package.json
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME#v}" != "$package_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the Web package.json version $package_version."
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level=moderate

      - name: Verify the Web app
        run: pnpm check

      - name: Verify generated API client is committed
        run: git diff --exit-code -- src/generated/api

  image-build:
    needs: [verify, verify-web]
    name: Image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            artifact: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            artifact: linux-arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out the Web app at the same tag
        uses: actions/checkout@v4
        with:
          repository: ${{ env.WEB_REPOSITORY }}
          ref: ${{ github.ref_name }}
          token: ${{ secrets.WEB_REPOSITORY_TOKEN || github.token }}
          path: openmeshtak-web

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Labels and per-platform annotations are identical on both native builds. Tags are attached
      # after the two digests have been assembled into one multi-platform image.
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ needs.verify.outputs.prerelease == 'false' }}
          labels: |
            org.opencontainers.image.title=OpenMeshTak
            org.opencontainers.image.licenses=AGPL-3.0-only
          annotations: |
            org.opencontainers.image.title=OpenMeshTak
            org.opencontainers.image.description=OpenMeshTak Core with the Web app and the built-in TAK server
            org.opencontainers.image.licenses=AGPL-3.0-only

      # Building ARM64 on its native runner avoids the expensive QEMU compilation path. Each job
      # pushes an untagged digest; the image job below creates the tagged multi-platform manifest.
      - name: Build and push by digest
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          build-contexts: web=./openmeshtak-web
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true,oci-mediatypes=true

      - name: Export image digest
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          digest="${{ steps.push.outputs.digest }}"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@v4
        with:
          name: image-digest-${{ matrix.artifact }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  image:
    needs: [verify, verify-web, image-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}

    steps:
      - name: Download image digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: image-digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 0.2.1 is tagged 0.2.1 and 0.2; stable releases also move `latest`. Pre-releases get only
      # their exact version. Index annotations make the metadata visible on the multi-arch image.
      - name: Image tags and annotations
        id: meta
        uses: docker/metadata-action@v5
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ needs.verify.outputs.prerelease == 'false' }}
          annotations: |
            org.opencontainers.image.title=OpenMeshTak
            org.opencontainers.image.description=OpenMeshTak Core with the Web app and the built-in TAK server
            org.opencontainers.image.licenses=AGPL-3.0-only

      - name: Create and verify multi-platform image
        id: manifest
        working-directory: ${{ runner.temp }}/digests
        shell: bash
        run: |
          tag_args=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then tag_args+=("--tag=$tag"); fi
          done <<< "$DOCKER_METADATA_OUTPUT_TAGS"

          annotation_args=()
          while IFS= read -r annotation; do
            if [ -n "$annotation" ]; then annotation_args+=("--annotation=$annotation"); fi
          done <<< "$DOCKER_METADATA_OUTPUT_ANNOTATIONS"

          image_args=()
          for digest_file in *; do
            image_args+=("${IMAGE}@sha256:${digest_file}")
          done

          docker buildx imagetools create "${tag_args[@]}" "${annotation_args[@]}" "${image_args[@]}"

          manifest_json="$(docker buildx imagetools inspect "${IMAGE}:${{ needs.verify.outputs.version }}" --format '{{json .Manifest}}')"
          jq -e '[.manifests[] | select(.platform.os == "linux") | .platform.architecture] | sort == ["amd64", "arm64"]' <<< "$manifest_json"
          digest="$(jq -r '.digest' <<< "$manifest_json")"
          test "$digest" != "null"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # GitHub artifact attestations need a public repository on the free plan, so private
      # releases skip this step; verify with `gh attestation verify oci://<image> -R <repo>`.
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

  release:
    needs: [verify, image]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out the Web app at the same tag
        uses: actions/checkout@v4
        with:
          repository: ${{ env.WEB_REPOSITORY }}
          ref: ${{ github.ref_name }}
          token: ${{ secrets.WEB_REPOSITORY_TOKEN || github.token }}
          path: openmeshtak-web

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            openmeshtak-web/pnpm-lock.yaml

      - name: Write release notices and SBOMs
        run: |
          pnpm install --frozen-lockfile
          pnpm release:notices
          cd openmeshtak-web
          pnpm install --frozen-lockfile
          mkdir -p dist
          pnpm release:notices

      # Everything an operator needs to run the published image, pinned to this release.
      - name: Package the release files
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          # The sample compose file defaults to this release instead of latest.
          mkdir -p release
          sed "s/{OPENMESHTAK_VERSION:-latest}/{OPENMESHTAK_VERSION:-$VERSION}/" docker-compose.yml > release/docker-compose.yml
          grep -q "OPENMESHTAK_VERSION:-$VERSION}" release/docker-compose.yml
          cp scripts/preflight.sh release/preflight.sh
          cp openapi/openapi.json "release/openmeshtak-openapi-$VERSION.json"
          cp dist/THIRD_PARTY_NOTICES.txt "release/openmeshtak-core-THIRD_PARTY_NOTICES-$VERSION.txt"
          cp dist/sbom.cdx.json "release/openmeshtak-core-sbom-$VERSION.cdx.json"
          cp openmeshtak-web/dist/THIRD_PARTY_NOTICES.txt "release/openmeshtak-web-THIRD_PARTY_NOTICES-$VERSION.txt"
          cp openmeshtak-web/dist/sbom.cdx.json "release/openmeshtak-web-sbom-$VERSION.cdx.json"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          prerelease_flag=""
          if [ "$PRERELEASE" = "true" ]; then prerelease_flag="--prerelease"; fi
          cat > release/notes.md <<EOF
          Image: \`$IMAGE:$VERSION\` (Core with the Web app)

          Download \`docker-compose.yml\` (it defaults to this release) and \`preflight.sh\`, then follow
          the Docker deployment steps in the README.
          EOF
          gh release create "$GITHUB_REF_NAME" --title "OpenMeshTak $VERSION" --notes-file release/notes.md \
            --verify-tag $prerelease_flag \
            release/docker-compose.yml \
            release/preflight.sh \
            "release/openmeshtak-openapi-$VERSION.json" \
            "release/openmeshtak-core-THIRD_PARTY_NOTICES-$VERSION.txt" \
            "release/openmeshtak-core-sbom-$VERSION.cdx.json" \
            "release/openmeshtak-web-THIRD_PARTY_NOTICES-$VERSION.txt" \
            "release/openmeshtak-web-sbom-$VERSION.cdx.json"
