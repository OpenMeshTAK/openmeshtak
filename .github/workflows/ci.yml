name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DATABASE_URL: file:./server/data/db/ci.sqlite
      NODE_ENV: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.12.4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: pnpm db:deploy

      - name: Audit dependencies
        run: pnpm audit --audit-level=moderate

      - name: Verify project
        run: pnpm check

      - name: Write release notices and SBOM
        run: pnpm release:notices

      - name: Smoke test a clean production install
        run: pnpm smoke:clean-install

      - name: Verify generated contract is committed
        # pnpm check regenerates the OpenAPI document and tsoa routes. A difference means a
        # controller or DTO changed without committing the generated contract.
        run: git diff --exit-code -- openapi/openapi.json src/generated/routes.ts
