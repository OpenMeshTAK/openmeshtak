# Override for servers where another reverse proxy (e.g. CloudPanel/nginx) already owns ports 80
# and 443 and terminates HTTPS. Caddy then serves plain HTTP on 127.0.0.1:8080 only; point the
# proxy at it. The TAK ports stay published by Core because they terminate mutual TLS themselves.
#
#   docker compose -f deploy/compose.yaml -f deploy/compose.reverse-proxy.yaml --env-file deploy/.env up -d

services:
  caddy:
    environment:
      SITE_ADDRESS: ":80"
    ports: !override
      - "127.0.0.1:8080:80"
