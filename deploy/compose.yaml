# OpenMeshTak with Caddy (public HTTPS for the Web app and API) and the built-in TAK server.
# Build both images from the sibling repositories, or replace `build` with published images.
#
#   cp deploy/.env.example deploy/.env      # then edit it
#   openssl rand -base64 32 > deploy/secrets/root_encryption_key
#   docker compose -f deploy/compose.yaml --env-file deploy/.env up -d --build
#
# Ports: 80/443 for Caddy, 8446/8443/8089 for TAK enrollment, Data Packages and the CoT stream.
# The TAK ports terminate mutual TLS in Core, so they bypass Caddy on purpose.

name: openmeshtak

services:
  core:
    build: ..
    restart: unless-stopped
    environment:
      PUBLIC_ORIGIN: https://${PUBLIC_HOST}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
    secrets:
      - root_encryption_key
    volumes:
      - core-data:/server/data
    ports:
      - "8446:8446"
      - "8443:8443"
      - "8089:8089"

  web:
    build: ../../openmeshtak-web
    restart: unless-stopped
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
      SITE_ADDRESS: ${PUBLIC_HOST}
      CORE_ADDRESS: core:3000
    depends_on:
      - core
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"

secrets:
  # Kept outside the database and the data volume; losing it makes encrypted secrets unreadable.
  root_encryption_key:
    file: ./secrets/root_encryption_key

volumes:
  core-data:
  caddy-data:
  caddy-config:
