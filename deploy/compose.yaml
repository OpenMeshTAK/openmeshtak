# OpenMeshTak with Caddy for public HTTPS. The OpenMeshTak image runs Core, which serves the Web app,
# the API and the built-in TAK server; it is the release set in OPENMESHTAK_VERSION.
#
#   cp deploy/.env.example deploy/.env      # then edit it
#   openssl rand -base64 32 > deploy/secrets/root_encryption_key
#   docker compose -f deploy/compose.yaml --env-file deploy/.env up -d
#
# To build the image from the sibling repositories instead, add compose.build.yaml and --build.
#
# Ports: 80/443 for Caddy, 8446/8443/8089 for TAK enrollment, Data Packages and the CoT stream.
# The TAK ports terminate mutual TLS in Core, so they bypass Caddy on purpose.
#
# This file is a sample. The ports on the TAK server page in the Web app are the only source for
# QR codes and profiles; the host ports published here must match them. To publish Data Packages
# on 8484 because another service owns 8443 (CloudPanel does), change "8443:8443" to "8484:8443"
# and enter 8484 on the TAK server page. Core always listens on 8446/8443/8089 inside the container.

name: openmeshtak

services:
  core:
    image: ghcr.io/openmeshtak/openmeshtak:${OPENMESHTAK_VERSION:?Set OPENMESHTAK_VERSION in .env}
    restart: unless-stopped
    environment:
      PUBLIC_ORIGIN: https://${PUBLIC_HOST}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
    secrets:
      - root_encryption_key
    volumes:
      - core-data:/server/data
    ports:
      - "8446:8446"
      - "8443:8443"
      - "8089:8089"

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
      SITE_ADDRESS: ${PUBLIC_HOST}
      CORE_ADDRESS: core:3000
    depends_on:
      - core
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"

secrets:
  # Kept outside the database and the data volume; losing it makes encrypted secrets unreadable.
  root_encryption_key:
    file: ./secrets/root_encryption_key

volumes:
  core-data:
  caddy-data:
  caddy-config:
